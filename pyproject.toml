[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hltv-api-jclge"
version = "1.0.0"
description = "Modern unofficial Python client for public HLTV.org pages"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "JCLGE" }]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "selenium>=4.25,<5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/nykytatalysman/HLTV.ORG-API"
Repository = "https://github.com/nykytatalysman/HLTV.ORG-API"

[tool.setuptools.packages.find]
include = ["HLTV*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
