name: validation

on:
  pull_request:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=HLTV --cov=hltv_service --cov-report=term-missing
      - run: python -m build

  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hltv-data-service:test .
      - name: API, authentication, persistence, UID, and shutdown
        shell: bash
        run: |
          set -euo pipefail
          volume="hltv-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token="ci-internal-token"
          cleanup() {
            docker rm -f hltv-ci >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume"
          docker run -d --name hltv-ci -p 18080:8000 \
            -v "$volume:/data" \
            -e HLTV_RUNTIME_MODE=api \
            -e HLTV_SCHEDULER_ENABLED=false \
            -e HLTV_SERVICE_TOKEN="$token" \
            hltv-data-service:test
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl --fail --silent \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:18080/v1/status >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/v2/matches/1)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:18080/v2/matches/1)" != "401"
          test "$(docker exec hltv-ci stat -c %u /proc/1)" != "0"
          docker exec hltv-ci test -f /data/hltv-service.sqlite
          docker stop --time 20 hltv-ci
          docker rm hltv-ci
          docker run -d --name hltv-ci -p 18080:8000 \
            -v "$volume:/data" \
            -e HLTV_RUNTIME_MODE=api \
            -e HLTV_SCHEDULER_ENABLED=false \
            -e HLTV_SERVICE_TOKEN="$token" \
            hltv-data-service:test
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health && break
            sleep 1
          done
          docker exec hltv-ci test -s /data/hltv-service.sqlite
          docker stop --time 20 hltv-ci

      - name: Chromium and driver compatibility
        run: |
          docker run --rm hltv-data-service:test python -c \
            "from selenium import webdriver; from selenium.webdriver.chrome.options import Options; o=Options(); o.binary_location='/usr/bin/chromium'; o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); d=webdriver.Chrome(options=o); d.get('about:blank'); assert d.current_url == 'about:blank'; d.quit()"
